services:
  department-db:
    image: postgres:16
    container_name: department-service-db
    restart: always
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: departmentdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    networks:
      - microservices-network

  department-service:
    build: .
    container_name: department-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://department-service-db:5432/departmentdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - department-db
    networks:
      - microservices-network

networks:
  microservices-network:
    external: true